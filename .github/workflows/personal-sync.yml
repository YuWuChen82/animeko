name: Personal Windows build and upstream sync

on:
  push:
    branches: [main, personal/**]
    paths-ignore:
      - '**/*.md'
      - '.codex/**'
      - '.agents/skills/**'
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: personal-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows:
    if: github.repository == 'YuWuChen82/animeko'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      JAVA_TOOL_OPTIONS: -Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.WindowsSelectorProvider
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Keep only the personal Windows workflow enabled
        shell: pwsh
        run: |
          $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Could not list inherited workflows' }
          $workflows = ($response | ConvertFrom-Json).workflows
          foreach ($workflow in $workflows) {
            if ($workflow.path -eq '.github/workflows/personal-sync.yml') { continue }
            $id = $workflow.id
            if ($workflow.state -eq 'active') {
              gh api --method PUT "repos/$env:GITHUB_REPOSITORY/actions/workflows/$id/disable"
              if ($LASTEXITCODE -ne 0) {
                $state = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/$id" --jq .state
                if ($LASTEXITCODE -ne 0 -or $state -eq 'active') { throw "Could not disable inherited workflow $id" }
              }
            }
            $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/$id/runs?per_page=20" --jq '.workflow_runs[] | select(.status != "completed") | .id'
            if ($LASTEXITCODE -ne 0) { throw "Could not list inherited runs for $id" }
            foreach ($run in $runs) {
              gh api --method POST "repos/$env:GITHUB_REPOSITORY/actions/runs/$run/cancel" --silent
              if ($LASTEXITCODE -ne 0) { Write-Warning "Run $run may already have finished" }
            }
            Write-Output "Disabled inherited workflow: $($workflow.name)"
          }

      - name: Prepare an upstream merge without publishing it
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'publish_merge=false' >> "$GITHUB_OUTPUT"
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch https://github.com/open-ani/animeko.git main
          upstream=$(git rev-parse FETCH_HEAD)
          if git merge-base --is-ancestor "$upstream" HEAD; then
            echo 'publish_merge=false' >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
            else
              echo 'build=true' >> "$GITHUB_OUTPUT"
            fi
          else
            if ! git merge --no-edit "$upstream"; then
              git merge --abort
              echo '::error::Upstream changes conflict with personal features. main was left unchanged; resolve the conflict manually.'
              exit 1
            fi
            echo 'publish_merge=true' >> "$GITHUB_OUTPUT"
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v4
        id: jbr-cache
        if: steps.sync.outputs.build == 'true'
        with:
          path: ${{ runner.temp }}/personal-jbr
          key: jbr-jcef-21.0.11-windows-x64-b1163.116

      - name: Install JBR 21 with JCEF and verify its checksum
        if: steps.sync.outputs.build == 'true' && steps.jbr-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = 'https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-windows-x64-b1163.116.tar.gz'
          $archive = Join-Path $env:RUNNER_TEMP 'personal-jbr.tar.gz'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $checksumFile = Join-Path $env:RUNNER_TEMP 'personal-jbr.checksum'
          Invoke-WebRequest -Uri "$url.checksum" -OutFile $checksumFile
          $checksum = Get-Content -LiteralPath $checksumFile -Raw
          $expected = ($checksum.Trim() -split '\s+')[0].ToLowerInvariant()
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash.ToLowerInvariant() -ne $expected) {
            throw 'JBR checksum mismatch'
          }
          New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'personal-jbr') -Force | Out-Null
          tar -xzf $archive -C (Join-Path $env:RUNNER_TEMP 'personal-jbr')
          if ($LASTEXITCODE -ne 0) { throw 'JBR extraction failed' }

      - name: Select cached JBR
        if: steps.sync.outputs.build == 'true'
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'personal-jbr'
          $javaHome = (Get-ChildItem -LiteralPath $directory -Directory | Where-Object {
            Test-Path -LiteralPath (Join-Path $_.FullName 'bin\java.exe')
          } | Select-Object -First 1).FullName
          if (-not $javaHome) { throw 'JBR installation was not found' }
          "JAVA_HOME=$javaHome" >> $env:GITHUB_ENV
          (Join-Path $javaHome 'bin') >> $env:GITHUB_PATH

      - uses: android-actions/setup-android@v3
        if: steps.sync.outputs.build == 'true'
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        if: steps.sync.outputs.build == 'true'
        with:
          cache-read-only: false

      - name: Configure Dandanplay API credentials
        if: steps.sync.outputs.build == 'true'
        shell: pwsh
        env:
          DANDANPLAY_APP_ID: ${{ secrets.DANDANPLAY_APP_ID }}
          DANDANPLAY_APP_SECRET: ${{ secrets.DANDANPLAY_APP_SECRET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DANDANPLAY_APP_ID) -or [string]::IsNullOrWhiteSpace($env:DANDANPLAY_APP_SECRET)) {
            throw 'Configure DANDANPLAY_APP_ID and DANDANPLAY_APP_SECRET under Settings > Secrets and variables > Actions before building a personal release.'
          }
          @"
          ani.dandanplay.app.id=$env:DANDANPLAY_APP_ID
          ani.dandanplay.app.secret=$env:DANDANPLAY_APP_SECRET
          "@ | Set-Content -LiteralPath 'local.properties' -Encoding ascii

      - name: Select a monotonic personal build version
        if: steps.sync.outputs.build == 'true'
        id: version
        shell: pwsh
        run: |
          $tag = gh api repos/open-ani/animeko/releases/latest --jq .tag_name
          if ($LASTEXITCODE -ne 0 -or $tag -notmatch '^v(\d+\.\d+\.\d+)$') { throw 'Could not read the upstream stable version' }
          $version = "$($Matches[1])-personal.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          "name=$version" >> $env:GITHUB_OUTPUT

      - name: Package Windows personal edition
        if: steps.sync.outputs.build == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.name }}'
          .\gradlew.bat :ci-helper:zipDesktopDistribution :ci-helper:generateDesktopDistributionManifest "-Pversion.name=$version" "-PCI_TAG=v$version" --console=plain --no-configuration-cache
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed; upstream merge was not published' }
          $package = "ci-helper/build/distributions/ani-$version.zip"
          Copy-Item -LiteralPath $package -Destination 'Animeko-personal-windows-x64.zip'
          Copy-Item -LiteralPath "$package.manifest.json" -Destination 'Animeko-personal-windows-x64.zip.manifest.json'
          $checksum = (Get-FileHash -LiteralPath 'Animeko-personal-windows-x64.zip' -Algorithm SHA1).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'Animeko-personal-windows-x64.zip.sha1' -Value $checksum -Encoding ascii

      - name: Publish the packaged upstream merge
        if: steps.sync.outputs.publish_merge == 'true'
        shell: bash
        run: git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        if: steps.sync.outputs.build == 'true'
        with:
          name: Animeko-personal-windows-x64
          path: |
            Animeko-personal-windows-x64.zip
            Animeko-personal-windows-x64.zip.sha1
            Animeko-personal-windows-x64.zip.manifest.json
          retention-days: 14

      - name: Publish the personal update release
        if: steps.sync.outputs.build == 'true' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $version = '${{ steps.version.outputs.name }}'
          gh release create "v$version" Animeko-personal-windows-x64.zip Animeko-personal-windows-x64.zip.sha1 Animeko-personal-windows-x64.zip.manifest.json --repo $env:GITHUB_REPOSITORY --target $sha --latest --title "Windows personal $version" --notes 'Personal Windows channel: customizable shortcuts, per-season audio/subtitle memory, and in-app updates from this repository. Upstream sync and Windows packaging completed successfully. Existing incorrect cache mappings are not migrated.'
          if ($LASTEXITCODE -ne 0) { throw 'Personal release publishing failed' }
